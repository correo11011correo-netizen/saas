[tool.ruff]
# Target Python version
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Enable Pyflakes (F), Pycodestyle (E, W), Isort (I)
select = ["E", "F", "W", "I", "C90", "UP"]
ignore = ["E501"] # Ignore line length as we use a custom length

[tool.ruff.lint.isort]
known-first-party = ["core", "sales", "stock", "whatsapp", "employees"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
